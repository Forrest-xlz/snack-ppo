mode: train
device: cpu
seed: 42
environment: { width: 5, height: 5, num_envs: 2, rollout_steps: 4 }
model: { hidden_size: 16 }
ppo:
  learning_rate: 0.0003
  batch_size: 4
  epochs: 1
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
training: { max_env_samples: 8, checkpoint_interval_samples: 8, checkpoint_dir: checkpoints-smoke }
inference: { model_path: checkpoints-smoke/latest.ot, fps: 10, deterministic: true, cell_size: 36 }
evaluation: { interval_samples: 8, episodes: 2, deterministic: true, max_steps_per_episode: 10 }
metrics: { score_window_episodes: 10, log_interval_samples: 8 }
early_stopping: { enabled: false, window_samples: 8, patience_windows: 2, min_episodes: 1 }
wandb:
  enabled: false
  project: ppo-snake
  entity: null
  group: null
  run_name: smoke
  mode: offline
  python_executable: C:/Users/Liuluotu/Anaconda/anaconda3/python.exe

[package]
name = "ppo-snake"
version = "0.1.0"
edition = "2021"

[lib]
name = "ppo_snake"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
macroquad = "0.4"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
tch = { version = "0.20", features = ["download-libtorch"] }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.20"
